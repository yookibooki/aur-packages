name: Lint
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true
jobs:
  consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Check consistency
        run: bash scripts/check-consistency.sh
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: { image: archlinux:base-devel }
    strategy:
      fail-fast: false
      matrix:
        pkg: [axonhub-bin, gitcrawl-bin, mpatch-bin, umadev-bin]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install deps
        run: pacman -Sy --noconfirm --needed shellcheck namcap
      - name: Verify ${{ matrix.pkg }}
        # makepkg refuses root; run as unprivileged user.
        run: |
          set -euo pipefail
          id checker &>/dev/null || useradd -m checker
          chmod -R a+rX .
          su -s /bin/bash checker -c "cd $PWD && bash scripts/verify-package.sh packages/${{ matrix.pkg }}/"
