name: Lint
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-24.04
    container: { image: archlinux:base-devel }
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: pacman -Syu --noconfirm && pacman -S --noconfirm shellcheck namcap
      - name: Check consistency
        run: bash scripts/check-consistency.sh
      - name: Verify packages
        # makepkg refuses to run as root and the container defaults to
        # root: verify as an unprivileged user. set -e plus || exit 1
        # keeps one red package failing the gate (a bare failing call
        # without -e would be silently ignored).
        run: |
          set -euo pipefail
          useradd -m checker
          chmod -R a+rX .
          su -s /bin/bash checker -c "cd $PWD && for p in packages/*/; do bash scripts/verify-package.sh \"\$p\" || exit 1; done"
