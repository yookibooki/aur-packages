name: Publish
on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "scripts/push-aur.sh"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: archlinux:base-devel
    steps:
      - name: Install deps (git first — checkout precondition)
        run: pacman -Sy --noconfirm --needed git github-cli openssh python curl

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Preflight — ./aur check
        run: |
          set -euo pipefail
          id builder &>/dev/null || useradd -m builder
          chown -R builder:builder .
          git config --system --add safe.directory '*'
          su -s /bin/bash builder -c \
            "export HOME=/home/builder; cd '$PWD' && ./aur check"

      - name: Set up AUR SSH (pinned host key, no TOFU)
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          AUR_KNOWN_HOSTS: ${{ secrets.AUR_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${AUR_SSH_KEY:?AUR_SSH_KEY secret is not set — aborting}"
          : "${AUR_KNOWN_HOSTS:?AUR_KNOWN_HOSTS secret is not set. Save 'ssh-keyscan -t ed25519 aur.archlinux.org' output as AUR_KNOWN_HOSTS.}"
          install -d -m700 -o builder -g builder /home/builder/.ssh
          install -m600 -o builder -g builder /dev/stdin /home/builder/.ssh/aur_key <<< "$AUR_SSH_KEY"
          install -m600 -o builder -g builder /dev/stdin /home/builder/.ssh/known_hosts <<< "$AUR_KNOWN_HOSTS"
          [[ -s /home/builder/.ssh/known_hosts ]] || { echo "ERROR: empty known_hosts" >&2; exit 1; }
          ssh-keygen -lf /home/builder/.ssh/known_hosts || true
          install -m600 -o builder -g builder /dev/stdin /home/builder/.ssh/config <<'EOF'
          Host aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Push to AUR
        run: |
          set -euo pipefail
          if su -s /bin/bash builder -c \
            "export HOME=/home/builder; cd '$PWD' && ./aur publish"; then
            echo "Shipped: the committed tree is on the AUR."
          else
            echo "::error::./aur publish failed — the AUR keeps its previous versions; the next update.yml probe dispatches this workflow again" >&2
            exit 1
          fi

      - name: Confirm what the AUR carries
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, urllib.error, urllib.request

          def warn(msg):
              print(f"::warning::{msg}")

          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent": "aur-packages"})
              with urllib.request.urlopen(req, timeout=60) as resp:
                  return resp.read()

          pkgs = sorted(
              name for name in os.listdir("packages")
              if os.path.isfile(os.path.join("packages", name, "PKGBUILD"))
          )
          if not pkgs:
              print("No packages in the tree; nothing to compare.")
              raise SystemExit(0)

          want, versions = {}, {}
          for name in pkgs:
              for f in ("PKGBUILD", ".SRCINFO"):
                  with open(os.path.join("packages", name, f), "rb") as fh:
                      want[(name, f)] = fh.read()
              text = want[(name, "PKGBUILD")].decode()
              ver = re.search(r"^pkgver=(.*)$", text, re.M)
              rel = re.search(r"^pkgrel=(.*)$", text, re.M)
              versions[name] = (ver.group(1).strip().strip("\"'") if ver else "?",
                                rel.group(1).strip() if rel else "1")

          unreachable, differing = [], []
          for name in pkgs:
              for f in ("PKGBUILD", ".SRCINFO"):
                  url = (f"https://aur.archlinux.org/cgit/aur.git/plain/{f}"
                         f"?h={name}")
                  try:
                      got = fetch(url)
                  except (urllib.error.URLError, OSError, ValueError) as e:
                      unreachable.append(f"{name}/{f} ({e})")
                  else:
                      if got != want[(name, f)]:
                          differing.append(f"{name}/{f}")
              print(f"checked {name}")

          if unreachable:
              warn("could not read these from the AUR: " + ", ".join(unreachable))
          if differing:
              warn("the AUR git copy differs from this tree: "
                   + ", ".join(differing)
                   + " — run ./aur check, then re-run this workflow")
          if not unreachable and not differing:
              print(f"AUR git carries this tree byte-for-byte for all "
                    f"{len(pkgs)} package(s).")

          try:
              query = "&".join(f"arg[]={p}" for p in pkgs)
              req = urllib.request.Request(
                  f"https://aur.archlinux.org/rpc/v5/info?{query}",
                  headers={"User-Agent": "aur-packages"})
              with urllib.request.urlopen(req, timeout=60) as resp:
                  body = json.load(resp)
              index = {r["Name"]: r.get("Version") for r in body.get("results", [])}
          except (urllib.error.URLError, OSError, ValueError, KeyError) as e:
              print(f"AUR RPC index not read ({e}); the git copy checked above is authoritative.")
              raise SystemExit(0)

          lagging = [f"{p} (index {index.get(p)!r}, tree {v}-{r})"
                     for p, (v, r) in sorted(versions.items())
                     if index.get(p) != f"{v}-{r}"]
          if lagging:
              print("info: the AUR RPC index has not caught up yet — "
                    + "; ".join(lagging)
                    + " — expected after a push; the git copy above is authoritative.")
          else:
              print(f"AUR RPC index matches this tree for all "
                    f"{len(pkgs)} package(s).")
          PY

      - name: Flag a break, or clear the flag
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          status="${{ job.status }}"
          [[ "$status" == "cancelled" || "$status" == "skipped" ]] && exit 0
          title="release path broken: ${{ github.workflow }}"
          n="$(gh issue list --state open --search "\"$title\" in:title" \
            --json number --jq '.[0].number // empty')"
          if [[ "$status" == "success" ]]; then
            [[ -n "$n" ]] || exit 0
            gh issue close "$n" --comment "Green run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} — the release path is up again."
          else
            body="$(printf '%s\n' \
              "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              "Conclusion: $status" \
              '' \
              'The unattended release path stopped here. Fix the cause, then re-run this workflow.')"
            if [[ -n "$n" ]]; then
              gh issue comment "$n" --body "$body"
            else
              gh issue create --title "$title" --body "$body"
            fi
          fi