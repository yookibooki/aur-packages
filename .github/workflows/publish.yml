name: Publish
# AUR leg: ./aur check -> SSH push -> read back the AUR. Runs on dispatch
# from update.yml and on a human's push to main. See README "The release
# path, end to end".
on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "scripts/push-aur.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: archlinux:base-devel
    steps:
      - name: Install deps (git first — checkout precondition)
        run: pacman -Sy --noconfirm --needed git openssh python curl

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Preflight — ./aur check
        run: |
          set -euo pipefail
          id builder &>/dev/null || useradd -m builder
          chown -R builder:builder .
          git config --system --add safe.directory '*'
          su -s /bin/bash builder -c \
            "export HOME=/home/builder; cd '$PWD' && ./aur check"

      - name: Set up AUR SSH (pinned host key, no TOFU)
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          AUR_KNOWN_HOSTS: ${{ secrets.AUR_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${AUR_SSH_KEY:?AUR_SSH_KEY secret is not set — aborting}"
          : "${AUR_KNOWN_HOSTS:?AUR_KNOWN_HOSTS secret is not set. Save 'ssh-keyscan -t ed25519 aur.archlinux.org' output as AUR_KNOWN_HOSTS.}"
          install -d -m700 -o builder -g builder /home/builder/.ssh
          install -m600 -o builder -g builder /dev/stdin /home/builder/.ssh/aur_key <<< "$AUR_SSH_KEY"
          install -m600 -o builder -g builder /dev/stdin /home/builder/.ssh/known_hosts <<< "$AUR_KNOWN_HOSTS"
          [[ -s /home/builder/.ssh/known_hosts ]] || { echo "ERROR: empty known_hosts" >&2; exit 1; }
          ssh-keygen -lf /home/builder/.ssh/known_hosts || true
          install -m600 -o builder -g builder /dev/stdin /home/builder/.ssh/config <<'EOF'
          Host aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Push to AUR
        run: |
          set -euo pipefail
          if su -s /bin/bash builder -c \
            "export HOME=/home/builder; cd '$PWD' && ./aur publish"; then
            echo "Shipped: the committed tree is on the AUR."
          else
            echo "::error::./aur publish failed — the AUR keeps its previous versions; the next update.yml probe dispatches this workflow again" >&2
            exit 1
          fi

      - name: Confirm what the AUR reports (warning only)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, time, urllib.request, urllib.error

          def warn(msg):
              print(f"::warning::{msg}")

          pkgs = {}
          for name in sorted(os.listdir("packages")):
              pb = os.path.join("packages", name, "PKGBUILD")
              if not os.path.isfile(pb):
                  continue
              with open(pb) as fh:
                  text = fh.read()
              ver = re.search(r"^pkgver=(.*)$", text, re.M)
              rel = re.search(r"^pkgrel=(.*)$", text, re.M)
              if ver:
                  pkgs[name] = (ver.group(1).strip().strip("\"'"),
                                rel.group(1).strip() if rel else "1")

          if not pkgs:
              print("No packages in the tree; nothing to compare.")
              raise SystemExit(0)

          def rpc():
              query = "&".join(f"arg[]={p}" for p in pkgs)
              req = urllib.request.Request(
                  f"https://aur.archlinux.org/rpc/v5/info?{query}",
                  headers={"User-Agent": "aur-packages"})
              with urllib.request.urlopen(req, timeout=60) as resp:
                  body = json.load(resp)
              return {r["Name"]: r.get("Version") for r in body.get("results", [])}

          want = {p: f"{v}-{r}" for p, (v, r) in pkgs.items()}
          remote, problem = {}, None
          for attempt in range(1, 7):
              try:
                  remote = rpc()
                  problem = next(
                      (f"{p}: AUR reports {remote.get(p)!r}, the tree has {w!r}"
                       for p, w in want.items() if remote.get(p) != w),
                      None)
              except (urllib.error.URLError, OSError, ValueError, KeyError) as e:
                  problem = f"AUR RPC query failed: {e}"
              if problem is None:
                  break
              if attempt < 6:
                  print(f"not settled yet ({problem}); re-reading in 15s")
                  time.sleep(15)

          for pkg, expected in want.items():
              if remote.get(pkg) == expected:
                  print(f"OK: AUR has {pkg} {expected}")
          if problem is not None:
              warn(problem)
          PY