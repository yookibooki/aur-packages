name: Update
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: archlinux:base-devel
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GH_PROMPT_DISABLED: "1"
    steps:
      - name: Install deps (git first — checkout precondition)
        run: pacman -Sy --noconfirm --needed git github-cli python curl

      - uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Bump drifted packages
        id: bump
        run: |
          set -euo pipefail
          id builder &>/dev/null || useradd -m builder
          if [[ ! -d .git ]]; then
            echo "::error::actions/checkout fell back to a REST-API tarball: no .git in the workspace"
            exit 1
          fi
          chown -R builder:builder .
          git config --system --add safe.directory '*'
          su -s /bin/bash builder -c \
            "export HOME=/home/builder GITHUB_TOKEN='$GITHUB_TOKEN'; cd '$PWD' && ./aur bump"
          if [[ -z "$(git status --porcelain -- packages/)" ]]; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "No drift — every active package is current."
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            git status --porcelain -- packages/
          fi

      - name: Gate — ./aur check on the bumped tree
        if: steps.bump.outputs.drift == 'true'
        run: |
          set -euo pipefail
          if su -s /bin/bash builder -c "export HOME=/home/builder; cd '$PWD' && ./aur check"; then
            echo "Gate green — this tree is what publish.yml would accept."
          else
            echo "::error::./aur check failed on the bumped tree — nothing pushed, merged or published"
            git diff -U0 -- packages/ \
              | grep -E '^[+-](_realver|pkgver|pkgrel|source_|sha256sums_)' || true
            exit 1
          fi

      - name: Record the bump on bump/upstream
        if: steps.bump.outputs.drift == 'true'
        run: |
          set -euo pipefail
          git config user.name "aur-bot"
          git config user.email "aur-bot@users.noreply.github.com"
          git switch -C bump/upstream
          git add -A packages/
          git commit -m "bump: update to latest upstream releases"
          git fetch --no-tags origin \
            '+refs/heads/bump/upstream:refs/remotes/origin/bump/upstream' || true
          git push --force-with-lease origin HEAD:bump/upstream

      - name: Open or refresh the bump PR
        id: pr
        if: steps.bump.outputs.drift == 'true'
        run: |
          set -euo pipefail
          title="bump: update to latest upstream releases"
          body=$(printf '%s\n' \
            'Opened, gated and merged by `.github/workflows/update.yml`. No human step.' \
            '' \
            'Every checksum was computed by `scripts/update-pkgbuild.sh` from a real' \
            'download of the release artifact — never typed, never `SKIP`. Before this' \
            'PR was merged the tree passed `./aur check`, and `publish.yml` runs that' \
            'same gate again on main before it pushes to the AUR.' \
            '' \
            '```' \
            "$(git diff -U0 HEAD~1..HEAD -- packages/ | grep -E '^[+-](_realver|pkgver|pkgrel|sha256sums)' || true)" \
            '```')
          number="$(gh pr list --head bump/upstream --state open \
            --json number --jq '.[0].number // empty')"
          if [[ -n "$number" ]]; then
            gh pr edit "$number" --title "$title" --body "$body"
          else
            url="$(gh pr create --base main --head bump/upstream --title "$title" --body "$body")"
            number="$(grep -oE 'pull/[0-9]+' <<<"$url" | tail -1 | cut -d/ -f2)"
          fi
          [[ "$number" =~ ^[0-9]+$ ]] || {
            echo "::error::could not determine the bump PR number (got '$number')" >&2
            exit 1
          }
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "url=$(gh pr view "$number" --json url --jq .url)" >> "$GITHUB_OUTPUT"

      - name: Merge the gated PR
        if: steps.bump.outputs.drift == 'true'
        env:
          PR: ${{ steps.pr.outputs.number }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          set -euo pipefail
          foreign="$(gh pr view "$PR" --json files --jq '[.files[].path | select(startswith("packages/") | not)] | join(", ")')"
          if [[ -n "$foreign" ]]; then
            echo "::error::PR #$PR touches files outside packages/: $foreign — refusing to merge" >&2
            exit 1
          fi
          state=""
          for _ in $(seq 1 24); do
            state="$(gh pr view "$PR" --json mergeable,state \
              --jq '.state + "/" + .mergeable')"
            case "$state" in
              MERGED/*|OPEN/MERGEABLE) break ;;
            esac
            echo "waiting for mergeability: $state"
            sleep 10
          done
          rc=0
          gh pr merge "$PR" --squash || rc=$?
          if [[ "$(gh pr view "$PR" --json state --jq .state)" != "MERGED" ]]; then
            echo "::error::PR #$PR is not merged (gh rc=$rc); nothing published, next probe retries" >&2
            exit 1
          fi
          echo "Merged $PR_URL into main."
          git push origin --delete bump/upstream || true

      - name: Ship to the AUR if main is not yet published
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GH_REPO/commits/main" --jq .sha)"
          echo "main is at $main_sha"
          run_state() {
            gh run list --workflow publish.yml --limit 20 \
              --json headSha,status,conclusion \
              --jq "[.[] | select(.headSha == \"$main_sha\")] as \$m
                    | if (\$m | length) == 0 then \"none\"
                      elif (\$m | map(select(.status != \"completed\")) | length) > 0 then \"inflight\"
                      elif (\$m | map(select(.conclusion == \"success\")) | length) > 0 then \"shipped\"
                      else \"failed\" end" || echo "none"
          }
          case "$(run_state)" in
            shipped)
              echo "main is published — the AUR is current."; exit 0 ;;
            inflight)
              echo "a publish.yml run for main is still going."; exit 0 ;;
            failed)
              echo "the last publish.yml run for main failed; retrying." ;;
            none)
              last_ok="$(gh run list --workflow publish.yml --status success --limit 1 \
                --json headSha --jq '.[0].headSha // empty' || true)"
              if [[ -z "$last_ok" ]]; then
                echo "no successful publish.yml run on record — shipping once to set the baseline."
              elif [[ "$last_ok" == "$main_sha" ]]; then
                echo "main is exactly what the last successful publish shipped."
                exit 0
              else
                files="$(gh api "repos/$GH_REPO/compare/$last_ok...$main_sha" \
                  --jq '.files[].filename')"
                if ! grep -q '^packages/' <<<"$files"; then
                  echo "main moved past the last publish outside packages/ — nothing to ship."
                  exit 0
                fi
                echo "main carries packages/ changes no publish has shipped."
              fi ;;
          esac
          gh workflow run publish.yml --ref main
          for _ in $(seq 1 12); do
            url="$(gh run list --workflow publish.yml --limit 5 --json headSha,status,url \
              --jq "[.[] | select(.headSha == \"$main_sha\") | select(.status != \"completed\")][0].url // empty")"
            if [[ -n "$url" ]]; then
              echo "Dispatched publish.yml: $url"
              exit 0
            fi
            sleep 10
          done
          echo "::error::publish.yml was dispatched but no run for $main_sha appeared" >&2
          exit 1