name: Update
# The upstream leg of the release path, end to end and unattended: probes
# every active registry entry on a schedule; where a newer release exists it
# bumps the PKGBUILD through the full ./aur transaction (real downloads ->
# real sha256 -> .SRCINFO regenerated by makepkg -> verify), gates the
# result on a complete ./aur check, records it as a PR, squash-merges that
# PR and hands main to publish.yml. The PR is the evidence, not the gate:
# the gate is ./aur check, run here before the merge and again by
# publish.yml before anything is pushed to the AUR.
#
# Why publish.yml is dispatched instead of waiting for the merge's push
# event: a push made with GITHUB_TOKEN does not start new workflow runs
# (GitHub's loop guard, to stop a workflow retriggering itself), and
# workflow_dispatch is the documented exception. So this workflow merges,
# then explicitly dispatches publish.yml at main. publish.yml still also
# fires on a human's push to main, which is why its `paths` filter is kept.
#
# Nothing here runs on a maintainer's machine: the bump, the gate and every
# checksum are computed on a runner. No AI involvement.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write # push the bump branch, squash-merge the PR
  pull-requests: write # open/refresh the bump PR
  actions: write # gh workflow run publish.yml, gh run list

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # The gate re-downloads every source of every active package after the
    # bump already downloaded them once; 60 is headroom, not a target.
    timeout-minutes: 60
    # makepkg is pacman-only and refuses to run as root, so the container
    # supplies both: Arch userland, and an unprivileged user below.
    container:
      image: archlinux:base-devel
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # Every gh call below is non-interactive by construction; this makes a
      # surprise prompt an error instead of a hung job.
      GH_PROMPT_DISABLED: "1"
    steps:
      # git MUST be installed before actions/checkout: with no git in PATH
      # the action falls back to a REST-API tarball — plain files, NO .git —
      # and every git operation below dies with "not a git repository".
      - name: Install deps (git first — checkout precondition)
        run: pacman -Sy --noconfirm --needed git github-cli python curl

      - uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Bump drifted packages
        id: bump
        run: |
          set -euo pipefail
          id builder &>/dev/null || useradd -m builder
          # Fail fast if checkout produced no .git (archive-mode fallback).
          if [[ ! -d .git ]]; then
            echo "::error::no .git in workspace: actions/checkout ran without git pre-installed (REST-API tarball fallback)"
            exit 1
          fi
          # builder must own the worktree: the bump edits PKGBUILDs under
          # packages/, and makepkg refuses root.
          chown -R builder:builder .
          git config --system --add safe.directory '*'
          su -s /bin/bash builder -c \
            "export HOME=/home/builder GITHUB_TOKEN='$GITHUB_TOKEN'; cd '$PWD' && ./aur bump"
          # --porcelain, not `git diff`: a brand-new package directory is
          # untracked, and drift in one must count as drift.
          if [[ -z "$(git status --porcelain -- packages/)" ]]; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "No drift — every active package is current."
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo "Drift — the tree changed under packages/:"
            git status --porcelain -- packages/
          fi

      # The gate. Everything below (push, merge, publish) is gated on it, so
      # this is the step that makes unattended publishing safe: the exact tree
      # it green-lights is the tree that reaches the AUR.
      - name: Gate — ./aur check must be green on the bumped tree
        if: steps.bump.outputs.drift == 'true'
        run: |
          set -euo pipefail
          # Same gate publish.yml runs before it ships: consistency, bash -n,
          # no SKIP or empty checksums, every .SRCINFO reproducing from its
          # PKGBUILD via makepkg, and every source of every active package
          # re-downloading and matching its committed sha256. Green here is
          # what makes the merge below safe; anything else halts, loudly.
          if su -s /bin/bash builder -c "export HOME=/home/builder; cd '$PWD' && ./aur check"; then
            echo "Gate green — this tree is exactly what publish.yml would accept."
          else
            echo "::error::./aur check failed on the bumped tree — halting. Nothing is pushed, merged or published; the run log is the evidence."
            git diff -U0 -- packages/ \
              | grep -E '^[+-](_realver|pkgver|pkgrel|source_|sha256sums_)' || true
            exit 1
          fi

      - name: Record the bump on bump/upstream
        if: steps.bump.outputs.drift == 'true'
        run: |
          set -euo pipefail
          git config user.name "aur-bot"
          git config user.email "aur-bot@users.noreply.github.com"
          # One stable branch, so repeated runs refresh a single PR instead
          # of piling up a new one every three hours.
          git switch -C bump/upstream
          git add -A packages/
          git commit -m "bump: update to latest upstream releases"
          # --force-with-lease needs the remote-tracking ref to compare
          # against; checkout is shallow, so fetch the branch first.
          git fetch --no-tags origin \
            '+refs/heads/bump/upstream:refs/remotes/origin/bump/upstream' || true
          git push --force-with-lease origin HEAD:bump/upstream

      - name: Open or refresh the bump PR
        id: pr
        if: steps.bump.outputs.drift == 'true'
        run: |
          set -euo pipefail
          title="bump: update to latest upstream releases"
          # The bump commit is HEAD, its parent is the main commit this run
          # checked out — no extra refs needed to show what changed.
          body=$(printf '%s\n' \
            'Opened, gated and merged by `.github/workflows/update.yml`. No human step.' \
            '' \
            'Every checksum below was computed by `scripts/update-pkgbuild.sh` from a' \
            'real download of the release artifact — never typed, never `SKIP`.' \
            'Before this PR was merged the whole tree passed `./aur check`: every' \
            'source re-downloaded and matched its committed checksum, and every' \
            '`.SRCINFO` reproduced from its PKGBUILD via makepkg. `publish.yml` runs' \
            'that same gate again on main before it pushes to the AUR.' \
            '' \
            '```' \
            "$(git diff -U0 HEAD~1..HEAD -- packages/ | grep -E '^[+-](_realver|pkgver|pkgrel|sha256sums)' || true)" \
            '```')
          # Only an OPEN PR for this branch can be refreshed: once merged, the
          # previous cycle's PR is still associated with the branch and
          # `gh pr edit` would fail on it. So ask for open ones by number and
          # carry that number through the rest of the run.
          number="$(gh pr list --head bump/upstream --state open \
            --json number --jq '.[0].number // empty')"
          if [[ -n "$number" ]]; then
            gh pr edit "$number" --title "$title" --body "$body"
            echo "Refreshed the open bump PR #$number."
          else
            url="$(gh pr create --base main --head bump/upstream --title "$title" --body "$body")"
            number="$(grep -oE 'pull/[0-9]+' <<<"$url" | tail -1 | cut -d/ -f2)"
            echo "Opened bump PR #$number."
          fi
          [[ "$number" =~ ^[0-9]+$ ]] || {
            echo "::error::could not determine the bump PR number (got '$number')" >&2
            exit 1
          }
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "url=$(gh pr view "$number" --json url --jq .url)" >> "$GITHUB_OUTPUT"

      - name: Merge the gated PR
        if: steps.bump.outputs.drift == 'true'
        env:
          PR: ${{ steps.pr.outputs.number }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          set -euo pipefail
          # Last line of defence: the PR must carry nothing but packages/.
          foreign="$(gh pr view "$PR" --json files --jq '[.files[].path | select(startswith("packages/") | not)] | join(", ")')"
          if [[ -n "$foreign" ]]; then
            echo "::error::PR #$PR touches files outside packages/: $foreign — refusing to merge" >&2
            exit 1
          fi
          # GitHub computes mergeability asynchronously; right after the push
          # it can still be UNKNOWN, which --squash will not act on.
          state=""
          for _ in $(seq 1 24); do
            state="$(gh pr view "$PR" --json mergeable,state \
              --jq '.state + "/" + .mergeable')"
            case "$state" in
              MERGED/*|OPEN/MERGEABLE) break ;;
            esac
            echo "waiting for mergeability: $state"
            sleep 10
          done
          echo "mergeability: $state"
          rc=0
          gh pr merge "$PR" --squash || rc=$?
          # Trust the API, not gh's exit path: a merge that landed is a merge,
          # and anything that failed to merge must be loud.
          if [[ "$(gh pr view "$PR" --json state --jq .state)" != "MERGED" ]]; then
            echo "::error::PR #$PR is not merged (gh rc=$rc); nothing was published and the next probe retries" >&2
            exit 1
          fi
          echo "Merged $PR_URL into main."
          # Tidy only; a failure here is cosmetic and the next run rewrites
          # the branch anyway.
          git push origin --delete bump/upstream || echo "note: bump/upstream left behind (harmless)"

      # The reconcile. Runs on every probe, drift or not, and is the only
      # thing that ships: dispatch publish.yml when main carries packages/
      # changes that no successful publish.yml run has covered yet. That
      # covers the merge above (a GITHUB_TOKEN push starts no run of its
      # own) and re-covers any publish that failed or was never dispatched,
      # which is how the AUR silently lagged this repo before publish.yml
      # existed. No drift and nothing outstanding = no dispatch.
      - name: Ship to the AUR if main is not yet published
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GH_REPO/commits/main" --jq .sha)"
          echo "main is at $main_sha"
          run_state() {
            gh run list --workflow publish.yml --limit 20 \
              --json headSha,status,conclusion \
              --jq "[.[] | select(.headSha == \"$main_sha\")] as \$m
                    | if (\$m | length) == 0 then \"none\"
                      elif (\$m | map(select(.status != \"completed\")) | length) > 0 then \"inflight\"
                      elif (\$m | map(select(.conclusion == \"success\")) | length) > 0 then \"shipped\"
                      else \"failed\" end" || echo "none"
          }
          case "$(run_state)" in
            shipped)
              echo "publish.yml already shipped $main_sha — the AUR is current."; exit 0 ;;
            inflight)
              echo "a publish.yml run for $main_sha is still going; leaving it alone."; exit 0 ;;
            failed)
              echo "the last publish.yml run for $main_sha failed; dispatching a retry." ;;
            none)
              last_ok="$(gh run list --workflow publish.yml --status success --limit 1 \
                --json headSha --jq '.[0].headSha // empty' || true)"
              if [[ -z "$last_ok" ]]; then
                echo "no successful publish.yml run on record; dispatching once to set the baseline."
              elif [[ "$last_ok" == "$main_sha" ]]; then
                echo "main is exactly what the last successful publish shipped."; exit 0
              else
                files="$(gh api "repos/$GH_REPO/compare/$last_ok...$main_sha" \
                  --jq '.files[].filename')"
                if ! grep -q '^packages/' <<<"$files"; then
                  echo "main moved past the last publish, but only outside packages/ — nothing to ship."
                  exit 0
                fi
                echo "main moved past the last publish and packages/ changed since — dispatching."
              fi ;;
          esac
          gh workflow run publish.yml --ref main
          # A dispatch is not a run until it is listed; wait for one at this
          # SHA instead of assuming the call landed.
          for _ in $(seq 1 12); do
            url="$(gh run list --workflow publish.yml --limit 5 --json headSha,status,url \
              --jq "[.[] | select(.headSha == \"$main_sha\") | select(.status != \"completed\")][0].url // empty")"
            if [[ -n "$url" ]]; then
              echo "Dispatched publish.yml: $url"
              exit 0
            fi
            sleep 10
          done
          echo "::error::publish.yml was dispatched but no run for $main_sha appeared within two minutes" >&2
          exit 1