name: Discover
# Zero-token update discovery (the old scheduled Repo Assist duty, now a
# plain deterministic workflow — see docs/workflows.md). Runs every 3h;
# probes every active registry entry, bumps drift through the full
# verify transaction, opens one PR per package. No AI involvement.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
concurrency:
  group: discover
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Same container policy as lint.yml's verify job: makepkg refuses
    # root, so discover.sh runs as an unprivileged user.
    container: { image: archlinux:base-devel }
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # git MUST exist before actions/checkout: with no git in PATH the
      # action falls back to a REST-API tarball — plain files, NO .git —
      # and every git operation (keepalive, branch/push/PR on drift) dies
      # with "not a git repository".
      - name: Install deps (git first — checkout precondition)
        run: pacman -Sy --noconfirm --needed git github-cli python curl shellcheck namcap
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Run discovery
        run: |
          set -euo pipefail
          id builder &>/dev/null || useradd -m builder
          # Fail fast if checkout produced no .git (archive-mode fallback —
          # the defect behind the hollow green runs: probes passed, every
          # git path was dead).
          if [[ ! -d .git ]]; then
            echo "::error::no .git in workspace: actions/checkout ran without git pre-installed (REST-API tarball fallback)"
            exit 1
          fi
          # Builder must own the worktree: drift bumps edit PKGBUILDs,
          # branch, commit, push and open PRs as builder (makepkg refuses
          # root). Root keeps git usable afterwards (owner=builder →
          # dubious ownership) via system-wide safe.directory.
          chown -R builder:builder .
          git config --system --add safe.directory '*'
          su -s /bin/bash builder -c \
            "cd '$PWD' && git rev-parse --is-inside-work-tree && test -w packages" \
            || { echo "::error::builder cannot see git or write the workspace"; exit 1; }
          rc=0
          su -s /bin/bash builder -c \
            "export HOME=/home/builder GH_TOKEN='$GH_TOKEN' SUMMARY_FILE=/tmp/discover-summary.md; cd '$PWD' && bash scripts/discover.sh" || rc=$?
          # Step summary is root-owned; builder cannot write it — publish here.
          if [[ -f /tmp/discover-summary.md && -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            cat /tmp/discover-summary.md >>"$GITHUB_STEP_SUMMARY" || true
          fi
          # Keep-alive heartbeat: docs/ is root-owned, so root commits it
          # when discover.sh queued the marker (repo silent >10d).
          if [[ -f /tmp/discover-keepalive-needed ]]; then
            printf '%s discover: probed active packages via scripts/discover.sh (keepalive)\n' \
              "$(date -u +%FT%TZ)" >>docs/heartbeat.log || true
            git add docs/heartbeat.log || true
            git -c user.name="discover-bot" -c user.email="discover-bot@users.noreply.github.com" \
              commit -m "keepalive: discover heartbeat" >/dev/null 2>&1 || true
            git push origin HEAD:main >/dev/null 2>&1 || true
          fi
          exit "$rc"
