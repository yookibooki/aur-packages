name: Discover
# Zero-token update discovery (the old scheduled Repo Assist duty, now a
# plain deterministic workflow — see docs/workflows.md). Runs every 3h;
# probes every active registry entry, bumps drift through the full
# verify transaction, opens one PR per package. No AI involvement.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
concurrency:
  group: discover
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Same container policy as lint.yml's verify job: makepkg refuses
    # root, so discover.sh runs as an unprivileged user.
    container: { image: archlinux:base-devel }
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Install deps
        run: pacman -Sy --noconfirm --needed git github-cli python curl shellcheck namcap
      - name: Run discovery
        run: |
          set -euo pipefail
          id builder &>/dev/null || useradd -m builder
          # Apply safe.directory system-wide: builder must be able to run git
          # in the root-owned checkout (log/push/PR on drift), independent of
          # HOME/global-config resolution.
          git config --system --add safe.directory '*'
          chmod -R a+rX .
          rc=0
          su -s /bin/bash builder -c \
            "export HOME=/home/builder; SUMMARY_FILE=/tmp/discover-summary.md; git config --global --add safe.directory '*' && cd '$PWD' && bash scripts/discover.sh" || rc=$?
          # Step summary is root-owned; builder cannot write it — publish here.
          if [[ -f /tmp/discover-summary.md && -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            cat /tmp/discover-summary.md >>"$GITHUB_STEP_SUMMARY" || true
          fi
          # Keep-alive heartbeat: docs/ is root-owned, so root commits it
          # when discover.sh queued the marker (repo silent >10d).
          if [[ -f /tmp/discover-keepalive-needed ]]; then
            printf '%s discover: probed active packages via scripts/discover.sh (keepalive)\n' \
              "$(date -u +%FT%TZ)" >>docs/heartbeat.log || true
            git add docs/heartbeat.log || true
            git -c user.name="discover-bot" -c user.email="discover-bot@users.noreply.github.com" \
              commit -m "keepalive: discover heartbeat" >/dev/null 2>&1 || true
            git push origin HEAD:main >/dev/null 2>&1 || true
          fi
          exit "$rc"
