name: Discover releases

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      pkg:
        description: 'Limit to a single package (empty = all)'
        required: false
        default: ''
      nightly-chroot:
        description: 'Use clean chroot (extra-x86_64-build) instead of fast build'
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  setup:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Build matrix (active && !hold)
        id: set-matrix
        env:
          ONLY_PKG: ${{ inputs.pkg }}
        run: |
          set -euo pipefail
          python3 - "$ONLY_PKG" <<'EOF' >> "$GITHUB_OUTPUT"
          import json, sys
          only = sys.argv[1]
          entries = json.load(open("packages/registry.json"))
          active = [e for e in entries if e.get("active", True) in (True, "true")]
          skipped = [e.get("pkg") for e in entries if e.get("active", True) not in (True, "true")]
          held = [e.get("pkg") for e in active if e.get("hold", False) in (True, "true")]
          matrix = [e for e in active if e.get("hold", False) not in (True, "true")]
          if only:
              matrix = [e for e in matrix if e.get("pkg") == only]
          print(f"Skipped (inactive): {skipped or 'none'}")
          print(f"Skipped (held): {held or 'none'}")
          print(f"Matrix: {[e.get('pkg') for e in matrix]}")
          print("matrix<<MATRIX_EOF")
          print(json.dumps(matrix))
          print("MATRIX_EOF")
          EOF

  update:
    needs: setup
    concurrency:
      group: aur-${{ matrix.pkg }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: "Check ${{ matrix.pkg }}"
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "packages/${{ matrix.pkg }}"
          allow_prerelease='${{ matrix.allow_prerelease }}'
          if [[ "$allow_prerelease" == 'true' ]]; then
            tag=$(gh release view -R "${{ matrix.upstream }}" --json tagName --jq '.tagName')
          else
            tag=$(gh release view -R "${{ matrix.upstream }}" --json tagName,isPrerelease --jq 'select(.isPrerelease == false) | .tagName')
            if [[ -z "$tag" || "$tag" == "null" ]]; then
              tag=$(gh release list -R "${{ matrix.upstream }}" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName')
            fi
          fi
          [[ -n "$tag" && "$tag" != "null" ]] || { echo "ERROR: could not determine latest release" >&2; exit 1; }
          ver_in_path='${{ matrix.ver_in_path }}'
          if [[ -z "$ver_in_path" || "$ver_in_path" == 'true' ]]; then
            latest="${tag#v}"
          else
            latest="$tag"
          fi
          [[ -n "$latest" ]] || { echo "ERROR: empty version after stripping tag prefix" >&2; exit 1; }
          current=$(bash -c 'set -u; source ./PKGBUILD; printf %s "${_realver:-$pkgver}"')
          [[ -n "$current" ]] || { echo "ERROR: PKGBUILD defines neither _realver nor pkgver" >&2; exit 1; }
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [[ "$latest" == "$current" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "reason=same" >> "$GITHUB_OUTPUT"
          elif [[ "$(printf '%s\n%s\n' "$current" "$latest" | sort -V | head -n1)" != "$current" ]]; then
            echo "WARNING: upstream latest ($latest) is older than current ($current); skipping" >&2
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "reason=downgrade" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "reason=upgrade" >> "$GITHUB_OUTPUT"
          fi

      - name: "Update PKGBUILD"
        if: steps.check.outputs.changed == 'true'
        env:
          NEW_VERSION: ${{ steps.check.outputs.latest }}
        run: |
          set -euo pipefail
          scripts/update-pkgbuild.sh \
            "packages/${{ matrix.pkg }}" \
            "$NEW_VERSION" \
            "${{ matrix.asset }}" \
            '${{ matrix.ext }}' \
            '${{ matrix.ver_in_url }}' \
            "${{ matrix.upstream }}" \
            '${{ matrix.ver_in_path }}' \
            '${{ matrix.version_in_asset }}' \
            <<< '${{ matrix.archs }}'
          bash -n "packages/${{ matrix.pkg }}/PKGBUILD"

      - name: "Recheck assets for ${{ matrix.pkg }}"
        id: recheck
        if: steps.check.outputs.reason == 'same'
        env:
          CURRENT_VERSION: ${{ steps.check.outputs.current }}
        run: |
          set -euo pipefail
          work="/tmp/recheck-${{ matrix.pkg }}"
          rm -rf "$work"
          cp -r "packages/${{ matrix.pkg }}" "$work"
          if scripts/update-pkgbuild.sh \
            "$work" \
            "$CURRENT_VERSION" \
            "${{ matrix.asset }}" \
            '${{ matrix.ext }}' \
            '${{ matrix.ver_in_url }}' \
            "${{ matrix.upstream }}" \
            '${{ matrix.ver_in_path }}' \
            '${{ matrix.version_in_asset }}' \
            <<< '${{ matrix.archs }}'; then
            if diff -q "$work/PKGBUILD" "packages/${{ matrix.pkg }}/PKGBUILD" >/dev/null; then
              echo "rechecked=false" >> "$GITHUB_OUTPUT"
            else
              cp "$work/PKGBUILD" "packages/${{ matrix.pkg }}/PKGBUILD"
              bash -n "packages/${{ matrix.pkg }}/PKGBUILD"
              echo "rechecked=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "WARNING: recheck download failed; will retry on next schedule" >&2
            echo "rechecked=false" >> "$GITHUB_OUTPUT"
          fi
          rm -rf "$work"

      - name: "Verify ${{ matrix.pkg }}"
        if: steps.check.outputs.changed == 'true' || steps.recheck.outputs.rechecked == 'true'
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/w" -w /w archlinux:base-devel bash -c '
            set -euo pipefail
            pacman -Sy --noconfirm --needed base-devel namcap shellcheck libarchive devtools
            useradd -m builder
            chmod -R a+rwX /w
            if [[ "${{ inputs.nightly-chroot }}" == "true" ]]; then
              su -s /bin/bash builder -c "cd /w/packages/${{ matrix.pkg }} && extra-x86_64-build"
              namcap -e carch "/w/packages/${{ matrix.pkg }}/PKGBUILD"
            else
              su -s /bin/bash builder -c "cd /w && bash scripts/verify-package.sh packages/${{ matrix.pkg }}"
              su -s /bin/bash builder -c "cd /w/packages/${{ matrix.pkg }} && makepkg -s --noconfirm --noarchive"
            fi'

      - name: Upload updated PKGBUILD
        if: steps.check.outputs.changed == 'true' || steps.recheck.outputs.rechecked == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: pkgbuild-${{ matrix.pkg }}
          path: packages/${{ matrix.pkg }}/PKGBUILD
          retention-days: 1

  report-failure:
    needs: [setup, update]
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: File rolling auto-fix issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          num=$(gh issue list --label auto-fix --state open --json number --jq '.[0].number // empty')
          if [[ -z "$num" ]]; then
            gh label create auto-fix --description "Automated failure tracking" --color d73a4a 2>/dev/null || true
            gh issue create --title "[auto-fix] discover failures" \
              --label auto-fix \
              --body "Discover failed: $RUN_URL" || true
          else
            gh issue comment "$num" --body "Discover failed: $RUN_URL"
          fi
