name: Fix problem
description: Report a broken package or failed update
title: "[bug] <what broke>"
labels: [bug]
body:
  - type: input
    id: pkg
    attributes:
      label: Package name
      placeholder: mytool-bin
    validations:
      required: false
  - type: textarea
    id: what
    attributes:
      label: What happened
      placeholder: What you saw, plus the failing run link if you have it
    validations:
      required: true
