name: Remove package
description: Request removal of a package
title: "[pkg-remove] <pkg-name>"
labels: [pkg-remove]
body:
  - type: input
    id: pkg
    attributes:
      label: Package name
      description: Exact package directory name under packages/
      placeholder: mytool-bin
    validations:
      required: true
  - type: dropdown
    id: archive_aur
    attributes:
      label: Also request AUR package deletion?
      description: AUR deletion requires a separate request on aur.archlinux.org; automation only archives locally and stops pushing.
      options: ["no", "yes"]
      default: 0
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Why should this package be removed?
    validations:
      required: true
