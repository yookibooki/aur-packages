name: Hold package
description: Hold/unhold automatic updates for a package
title: "[pkg-hold] <pkg-name>"
labels: [pkg-hold]
body:
  - type: input
    id: pkg
    attributes:
      label: Package name
      description: Exact package directory name under packages/
      placeholder: mytool-bin
    validations:
      required: true
  - type: dropdown
    id: action
    attributes:
      label: Action
      options: ["hold", "unhold"]
      default: 0
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason
    validations:
      required: true
